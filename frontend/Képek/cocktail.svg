<svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Martini glass glowing gold and rose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2A24C"/>
      <stop offset="100%" stop-color="#B03B62"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#D2A24C" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#D2A24C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0CC85"/>
      <stop offset="100%" stop-color="#D2A24C"/>
    </linearGradient>
    <clipPath id="bowlClip">
      <path d="M70 110 L330 110 C300 172 236 232 212 250 L188 250 C164 232 100 172 70 110 Z"/>
    </clipPath>
  </defs>

  <!-- háttér izzás és neon ívek -->
  <circle cx="200" cy="200" r="185" fill="url(#glow)"/>
  <path d="M50 110 A240 240 0 0 1 200 18" fill="none" stroke="#B03B62" stroke-width="2" opacity=".5"/>
  <path d="M350 110 A240 240 0 0 0 200 18" fill="none" stroke="#D2A24C" stroke-width="2" opacity=".5"/>

  <!-- folyadék (a tál formájára vágva) -->
  <g clip-path="url(#bowlClip)">
    <rect x="60" y="136" width="280" height="130" fill="url(#liquid)" opacity=".95"/>
    <ellipse cx="200" cy="136" rx="120" ry="11" fill="#F0CC85" opacity=".35"/>
  </g>

  <!-- tál körvonala -->
  <path d="M70 110 L330 110 C300 172 236 232 212 250 L188 250 C164 232 100 172 70 110 Z"
        fill="none" stroke="url(#rimGrad)" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="200" cy="110" rx="130" ry="14" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- üvegfény a tál bal oldalán -->
  <path d="M92 124 C112 160 140 190 168 214" fill="none" stroke="#FFF3D6" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>

  <!-- szár + talp egyetlen formában (a szár fokozatosan kiszélesedik) -->
  <path d="M196 270 L196 386 C196 412 150 420 120 429 A80 13 0 0 0 280 429 C250 420 204 412 204 386 L204 270 Z"
        fill="#15121A" stroke="url(#rimGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- csomó (itt fogják a poharat) -->
  <ellipse cx="200" cy="262" rx="13" ry="11" fill="#15121A" stroke="url(#rimGrad)" stroke-width="3.5"/>

  <!-- koktélpálcika meggyel -->
  <line x1="278" y1="58" x2="206" y2="170" stroke="#F0CC85" stroke-width="3" stroke-linecap="round"/>
  <circle cx="234" cy="128" r="13" fill="#B03B62"/>
  <circle cx="230" cy="123" r="4" fill="#FFF3D6" opacity=".6"/>

  <!-- buborékok -->
  <circle cx="165" cy="170" r="3.5" fill="#F0CC85" opacity=".8"/>
  <circle cx="185" cy="152" r="2.5" fill="#F0CC85" opacity=".6"/>
  <circle cx="150" cy="150" r="2" fill="#F0CC85" opacity=".5"/>
</svg>
