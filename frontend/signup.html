<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

     <div class="wrap">
        <div class="left">
   <div class="hero-visual">
      <div class="frame">
        <img src="Képek/cocktail.svg" alt="Stylized coupe cocktail glowing gold and rose">
      </div>
    </div>
  </div>
  


  <div class="right">
    <h1>Create your account</h1>
    <div class="sub">Join Lumi to book tables, save favourites and buy tickets faster.

</div>

    <form id="signupForm">
      

<div class="name-row">
  <div class="halffield">
    <label for="firstName">Firstname</label>
    <input type="text" id="firstName" placeholder="James">
  </div>

 <div class="halffield">
    <label for="lastName">Lastname</label>
    <input type="text" id="lastName" placeholder="Smith">
  </div>
</div>






  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@email.com">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="••••••••">
      <button type="button" id="togglePassword">Show</button>
    </div>
  </div>

  <div class="field">
    <label for="passwordagain">Confirm password</label>
    <div class="password-wrap">
      <input type="password" id="passwordagain" placeholder="••••••••">
      <button type="button" id="toggleConfirm">Show</button>
    </div>
  </div>

  <button type="submit" class="btn-lumi">Create account</button>
</form>
</div>
<div class="modal-overlay" id="verifyModal">
  <div class="modal-box">
    <h2>Check your email</h2>
    <p class="sub">We sent a 6-digit code to <span id="verifyEmail"></span></p>

    <div class="code-row" id="codeRow">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
    </div>

    <button class="btn-lumi" id="verifyBtn">Verify</button>
    <p class="resend">Didn't get it? <button type="button" id="resendBtn">Resend code</button></p>
  </div>
</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="signup.js"></script>
</body>
</html>
