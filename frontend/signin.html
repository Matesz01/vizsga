<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="wrap">
        <div class="left">
   <div class="hero-visual">
      <div class="frame">
        <img src="Képek/cocktail.svg" alt="Stylized coupe cocktail glowing gold and rose">
      </div>
    </div>
  </div>
  


  <div class="right">
    <h1>Welcome back</h1>
    <div class="sub">Sign in to book your table and keep your tickets in one place.</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="••••••••">
          <button type="button" id="togglePassword">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-lumi">Sign in</button>
    </form>
</div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="signin.js"></script>
</body>
</html>
